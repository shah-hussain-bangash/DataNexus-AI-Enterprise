# Optional local-only PostgreSQL audit integration.
# Run with BOTH compose files after creating portal-db.env.
services:
  audit-db:
    image: postgres:16-alpine
    env_file:
      - ./portal-db.env
    volumes:
      - datanexus_audit_pg:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datanexus_local -d datanexus_audit"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    depends_on:
      audit-db:
        condition: service_healthy
    env_file:
      - ./portal.env
      - ./portal-db.env
    environment:
      DATANEXUS_AUDIT_REQUIRED: "true"
      DATANEXUS_AUDIT_DSN: "postgresql://datanexus_local:${POSTGRES_PASSWORD}@audit-db:5432/datanexus_audit"
volumes:
  datanexus_audit_pg:
