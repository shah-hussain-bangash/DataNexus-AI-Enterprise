[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datanexus-ai-enterprise"
version = "0.1.0"
description = "Phase 2 aviation ingestion and Kafka stream processing foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4,<3"]

[tool.setuptools.packages.find]
include = ["datanexus*"]
