name: datanexus-mta-restart-lab
services:
  redpanda-lab:
    image: docker.redpanda.com/redpandadata/redpanda:v26.3.1
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://redpanda-lab:9092,external://127.0.0.1:29092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-lab:33145
      - --mode
      - dev-container
      - --smp
      - "1"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - datanexus_mta_restart_lab_data:/var/lib/redpanda/data
volumes:
  datanexus_mta_restart_lab_data:
