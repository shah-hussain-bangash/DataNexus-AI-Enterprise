# Add to docker-compose.minio.yml; audit only reads existing remote Iceberg tables.
services:
  iceberg-audit:
    image: apache/spark:3.5.5
    user: "0:0"
    entrypoint: ["/opt/spark/bin/spark-submit"]
    depends_on:
      - iceberg-rest
    environment:
      SPARK_LOCAL_IP: "127.0.0.1"
      AWS_ACCESS_KEY_ID: ${DATANEXUS_S3_ACCESS_KEY:?Set DATANEXUS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${DATANEXUS_S3_SECRET_KEY:?Set DATANEXUS_S3_SECRET_KEY}
      AWS_REGION: us-east-1
    command:
      - "--master"
      - "local[2]"
      - "--conf"
      - "spark.ui.enabled=false"
      - "--packages"
      - "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2,org.apache.iceberg:iceberg-aws-bundle:1.9.2"
      - "/opt/project/pipelines/spark_iceberg_audit.py"
      - "--expected-unique"
      - "2"
    volumes:
      - ./pipelines/spark_iceberg_audit.py:/opt/project/pipelines/spark_iceberg_audit.py:ro
      - phase2f_ivy_cache:/root/.ivy2
