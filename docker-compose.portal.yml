name: datanexus-portal
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./portal.env
    environment:
      DATANEXUS_SQLITE_PATH: /opt/project/data/dev/aviation.sqlite3
      DATANEXUS_DATA_ROOT: /opt/project/data/dev
    volumes:
      - ./data/dev:/opt/project/data/dev
    expose:
      - "8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      DATANEXUS_PUBLIC_ORIGIN: http://127.0.0.1:13000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    ports:
      - "127.0.0.1:13000:3000"
    restart: unless-stopped
