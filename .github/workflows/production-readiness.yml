name: Production Release Gate — Evidence Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release_gate.py'
      - 'tests/test_production_release_gate.py'
      - 'docs/12-production-operations/production-completion-contract.md'
      - '.github/workflows/production-readiness.yml'
jobs:
  evidence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release gate fail-closed behavior
        run: python -m unittest discover -s tests -p 'test_production_release_gate.py' -v
      - name: Report current production readiness without bypassing failure
        run: |
          python scripts/release_gate.py --json > production-readiness-report.json || gate_status=$?
          echo "Gate exit code: ${gate_status:-0}"
          python -c "import json; r=json.load(open('production-readiness-report.json')); print(r['status'],str(r['passed'])+'/'+str(r['required']))"
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-audit
          path: production-readiness-report.json
