name: Phase 2B lakehouse reference tests
on:
  push:
    paths:
      - 'datanexus/lakehouse.py'
      - 'tests/test_lakehouse.py'
      - 'datanexus/events.py'
      - 'datanexus/storage.py'
      - '.github/workflows/phase2b-tests.yml'
  pull_request:
jobs:
  lakehouse-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q datanexus
